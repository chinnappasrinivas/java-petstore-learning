
stages:
  - build
  - test
  - publish
  - dast

include:
  - template: Security/API-Discovery.gitlab-ci.yml
  - template: Security/DAST-API.gitlab-ci.yml

variables:
    # Docker-in-docker settings
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2

build:
  stage: build
  image: maven:3.6.3-jdk-8
  script:
    - mvn package
  artifacts:
    when: always
    paths:
      - target/openapi-spring-0.0.0.jar
  cache:
    key: "$CI_COMMIT_REF_NAME"
    paths:
      - .m2

publish:
  stage: publish
  needs: ["build"]
  image: registry.gitlab.com/mikeeddington/docker-compose:20.10
  services:
    - docker:20.10-dind
  script:
    - mkdir -p $HOME/.docker; docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY;
    - TAG=$CI_REGISTRY_IMAGE/java-spring-boot-petstore:$CI_COMMIT_SHORT_SHA
    - DOCKER_BUILDKIT=1 docker build -t ${TAG} .
    - docker push $TAG

api_discovery:
  extends: .api_discovery_java_spring_boot
  needs: ["build"]
  image: eclipse-temurin:8-jre-alpine
  variables:
    API_DISCOVERY_JAVA_CLASSPATH: target/openapi-spring-0.0.0.jar
  before_script:
    - apk add --no-cache curl

dast_api:
  needs: ["api_discovery", "publish"]
  services:
    - name: $CI_REGISTRY_IMAGE/java-spring-boot-petstore:$CI_COMMIT_SHORT_SHA
      alias: target
  variables:
    DAST_API_TARGET_URL: http://target:8080
    DAST_API_OPENAPI: gl-api-discovery-openapi.json
